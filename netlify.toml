[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[functions."*"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
